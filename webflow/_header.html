<!-- ============================================================
     Toronique — Site Settings → Custom Code → HEAD
     This file is the version-controlled source of truth for the
     head block. Paste its contents into Webflow Site Settings,
     replacing everything currently between the Start/End markers.
     Changes vs the previous head:
     - duplicate viewport meta (maximum-scale=1) removed — it
       disabled pinch-zoom (accessibility fail); prevent iOS input
       zoom with input font-size >= 16px instead
     - font preload type corrected: font/tff -> font/ttf
     - Phosphor icon CSS moved here from the body embed
     - site CSS now loads from the pinned jsDelivr build (the old
       embed carried an inline copy AND a sandbox link — the same
       stylesheet shipped twice)
     - JSON-LD replaced with the fixed global block (aggregateRating
       removed per Google guidance; logo/image + WebSite node added)
     - empty Finsweet placeholder comment removed
     Remember to bump @1.0.0 when you tag a new release.
     ============================================================ -->

  .g-embed-code,
  /* .g-grid-guide, */
  .w-webflow-badge {
    z-index: -99999 !important;
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
  }

  /* --------- Lenis Smooth Scrolling --------- */
  html.lenis {
    height: auto;
  }
  .lenis.lenis-smooth {
    scroll-behavior: auto !important;
  }
  .lenis.lenis-smooth [data-lenis-prevent] {
    overscroll-behavior: contain;
  }
  .lenis.lenis-stopped {
    overflow: hidden;
  }
</style>
